<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>HACKED BY TAN</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { height: 100%; background: #000; overflow: hidden; font-family: "Courier New", monospace; }

  canvas { position: fixed; inset: 0; z-index: 0; }

  .scanlines {
    position: fixed; inset: 0; z-index: 2; pointer-events: none;
    background: repeating-linear-gradient(0deg, rgba(0,0,0,0) 0, rgba(0,0,0,0) 2px, rgba(0,0,0,.25) 3px);
  }

  .wrap {
    position: relative; z-index: 1; height: 100%;
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    text-align: center; padding: 20px;
  }

  .skull { font-size: clamp(60px, 14vw, 140px); filter: drop-shadow(0 0 20px #0f0); animation: float 3s ease-in-out infinite; }
  @keyframes float { 50% { transform: translateY(-12px); } }

  .glitch {
    position: relative; color: #0f0; font-weight: 900; letter-spacing: 4px;
    font-size: clamp(32px, 9vw, 96px); text-shadow: 0 0 10px #0f0, 0 0 30px #0f0;
    margin: 10px 0;
  }
  .glitch::before, .glitch::after {
    content: attr(data-text); position: absolute; left: 0; top: 0; width: 100%; overflow: hidden;
  }
  .glitch::before { color: #f0f; left: 3px; text-shadow: -2px 0 #f0f; animation: g1 2s infinite linear alternate-reverse; clip-path: inset(0 0 55% 0); }
  .glitch::after  { color: #0ff; left: -3px; text-shadow: 2px 0 #0ff; animation: g2 1.5s infinite linear alternate-reverse; clip-path: inset(55% 0 0 0); }
  @keyframes g1 { 0% { transform: translate(0); } 20% { transform: translate(-4px, 2px); } 40% { transform: translate(4px, -2px); } 60% { transform: translate(-2px, 1px); } 80% { transform: translate(3px, -1px); } 100% { transform: translate(0); } }
  @keyframes g2 { 0% { transform: translate(0); } 25% { transform: translate(4px, -2px); } 50% { transform: translate(-4px, 2px); } 75% { transform: translate(2px, -1px); } 100% { transform: translate(0); } }

  .msg { color: #0f0; font-size: clamp(14px, 2.5vw, 22px); margin-top: 18px; min-height: 1.6em; text-shadow: 0 0 8px #0f0; }
  .cursor { display: inline-block; width: 10px; background: #0f0; margin-left: 3px; animation: blink 1s steps(1) infinite; }
  @keyframes blink { 50% { opacity: 0; } }

  .terminal {
    margin-top: 28px; width: min(560px, 92vw); text-align: left;
    border: 1px solid #0f0; background: rgba(0, 20, 0, .7); padding: 14px 16px;
    color: #0f0; font-size: 13px; line-height: 1.6; box-shadow: 0 0 20px rgba(0,255,0,.3);
  }
  .terminal .dim { opacity: .6; }

  .footer { margin-top: 22px; color: #0a0; font-size: 12px; letter-spacing: 2px; }
</style>
</head>
<body>

<canvas id="matrix"></canvas>
<div class="scanlines"></div>

<div class="wrap">
  <div class="skull">💀</div>
  <h1 class="glitch" data-text="HACKED BY TAN">HACKED BY TAN</h1>
  <div class="msg"><span id="typed"></span><span class="cursor">&nbsp;</span></div>

  <div class="terminal" id="term">
    <div class="dim">root@tan:~# ./pwn --target this-site</div>
    <div>[+] Bypassing firewall... <span style="color:#fff">OK</span></div>
    <div>[+] Injecting payload... <span style="color:#fff">OK</span></div>
    <div>[+] Defacing homepage... <span style="color:#fff">DONE</span></div>
  </div>

  <div class="footer">// TAN WAS HERE //</div>
</div>

<script>
  // Matrix rain
  const c = document.getElementById('matrix');
  const ctx = c.getContext('2d');
  let cols, drops;
  const chars = '01アイウエオカキクケコサシスセソタチツテトナニヌネノ$#@%&TAN';
  function resize() {
    c.width = innerWidth; c.height = innerHeight;
    cols = Math.floor(c.width / 16);
    drops = Array(cols).fill(1);
  }
  resize(); addEventListener('resize', resize);
  setInterval(() => {
    ctx.fillStyle = 'rgba(0,0,0,0.08)';
    ctx.fillRect(0, 0, c.width, c.height);
    ctx.fillStyle = '#0f0';
    ctx.font = '16px monospace';
    drops.forEach((y, i) => {
      ctx.fillText(chars[Math.floor(Math.random() * chars.length)], i * 16, y * 16);
      if (y * 16 > c.height && Math.random() > 0.975) drops[i] = 0;
      drops[i]++;
    });
  }, 45);

  // Typing effect
  const lines = [
    'Your security is a joke.',
    'System compromised.',
    'Greetz to all hackers worldwide.'
  ];
  const el = document.getElementById('typed');
  let l = 0, i = 0, del = false;
  (function type() {
    const t = lines[l];
    el.textContent = t.slice(0, i);
    if (!del && i < t.length) { i++; setTimeout(type, 70); }
    else if (!del) { del = true; setTimeout(type, 1500); }
    else if (i > 0) { i--; setTimeout(type, 30); }
    else { del = false; l = (l + 1) % lines.length; setTimeout(type, 400); }
  })();
</script>
</body>
</html>
